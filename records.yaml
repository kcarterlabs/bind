zone: kcarterlabs.tech
soa:
  primary_ns: ns1.kcarterlabs.tech.
  # Every server's NS name; zone_converter.py writes one NS record each.
  nameservers: [ns1.kcarterlabs.tech., ns2.kcarterlabs.tech.]
  admin_email: admin.kcarterlabs.tech.
  # auto: the Unix time when the zone is generated, so it rises on every
  # change without anyone bumping it. A fixed number also works.
  serial: auto
  refresh: 3600
  retry: 1800
  expire: 604800
  minimum: 86400
records:
  - name: glados
    type: A
    value: 192.168.10.2
    ttl: 300
  - name: www
    type: CNAME
    value: kcarterlabs.tech.
    ttl: 300
  - name: ns1             # bind-a (pve5)
    type: A
    value: 10.10.69.26
  - name: ns2             # bind-b (pve4)
    type: A
    value: 10.10.69.27
  - name: pihole
    type: A
    value: 10.10.69.72
  - name: 1u-pve
    type: A
    value: 192.168.10.15
    ttl: 300
  - name: rancher 
    type: A
    value: 10.10.69.3
    ttl: 300
  - name: truenas         # the UI, via Traefik; https://10.20.69.2 still works
    type: A
    value: 10.10.69.30
    ttl: 300
  - name: hermes
    type: A
    value: 192.168.10.1
    ttl: 300
  - name: unifi
    type: A
    value: 192.168.10.14
    ttl: 300
  - name: truenasbackup
    type: A
    value: 10.10.69.9
    ttl: 300
  - name: pihole2
    type: A
    value: 10.10.69.22
    ttl: 300
  - name: pihole3
    type: A
    value: 10.10.69.23
    ttl: 300
  - name: dinner-menu
    type: A
    value: 10.10.69.21
    ttl: 300

