name: Docker Image CI

# Pull requests: validate only. Pushes to main: validate, then build and push
# to ECR, where the Ansible deploy (`make deploy`) pulls the image from.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # The same checks as `make validate` on a laptop: records lint, Ansible
  # syntax, compose render, image build, named-checkzone + named-checkconf.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip install --quiet ansible-core pyyaml
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Validate
        run: make validate

  build_docker_image:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read
      issues: write
    env:
      # AWS_REGION: us-west-2
      CHART_DIR: bind-flask/
      CHART_NAME: bind-flask
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4 
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: kcarterlabs/bind
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # code-<hash of the image's code>: the tag `make deploy` pulls.
          CODE_TAG=$(scripts/image-tag.sh)
          # build and push only on successful build
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG . && \
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG && \
          # Tag and push the code tag and latest only if the above succeeded
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:$CODE_TAG && \
          docker push $REGISTRY/$REPOSITORY:$CODE_TAG && \
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:latest && \
          docker push $REGISTRY/$REPOSITORY:latest
          echo "Pushed $IMAGE_TAG, $CODE_TAG and latest" >> "$GITHUB_STEP_SUMMARY"
