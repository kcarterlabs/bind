[defaults]
inventory            = inventory/hosts.ini
# Your own account and SSH key: networkdocker isn't in ~/Code/grafana's
# fleet, so svc-observability doesn't exist there. kenny has passwordless
# sudo and is in the docker group (checked 2026-10-18).
remote_user          = kenny
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
