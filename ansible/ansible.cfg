[defaults]
inventory            = inventory/hosts.ini
# The account ~/Code/grafana's bootstrap creates on every fleet host, as in
# the sibling repos. networkdocker isn't in the fleet: it overrides both in
# host_vars/networkdocker.yml.
remote_user          = svc-observability
private_key_file     = ~/.ssh/svc-observability_ed25519
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
stdout_callback      = default
result_format        = yaml
callbacks_enabled    = profile_tasks
interpreter_python   = auto_silent

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
