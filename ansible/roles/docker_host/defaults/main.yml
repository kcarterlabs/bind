---
# docker_version (group_vars) is the major version apt is pinned to.
docker_packages: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]

# Daemon-wide log rotation: json-file doesn't rotate by default. The compose
# project sets its own as well; this covers anything else run by hand.
docker_log_max_size: "50m"
docker_log_max_file: "3"
