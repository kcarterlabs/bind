---
bind_config_dir: "{{ bind_root }}/config"
bind_compose_dir: "{{ bind_root }}/compose"

# The repo root, where records.yaml and the image's files live. The role
# ships them as they are: there is one records.yaml, used by this deploy,
# the CI image and (copied) the Helm chart.
bind_repo_root: "{{ playbook_dir }}/.."

# What the deploy mounts at /etc/bind/managed (BIND_CONFIG_DIR). A change to
# any of them is a reload, not a restart.
bind_config_files: [records.yaml, named.conf.options, named.conf.local]

# The image CI pushes on every push to main (.github/workflows). The deploy
# deploys code-<hash> for the code in this checkout (scripts/image-tag.sh, the
# same script CI tags with), so the server runs exactly what CI built and a
# records-only commit doesn't change the image.
bind_ecr_registry: 856817629634.dkr.ecr.us-west-2.amazonaws.com
bind_ecr_repository: kcarterlabs/bind
bind_ecr_region: us-west-2
# This machine pulls the image from ECR and copies it to each server that
# lacks it (docker save | docker load), so the servers need no AWS
# credentials. Log this machine's Docker in to ECR first; tests point the
# registry elsewhere and turn this off.
bind_ecr_login: true
# Where the saved image waits between the pull and the copies.
bind_image_cache: "{{ bind_repo_root }}/.render/images"
# Check from this machine that CI has pushed the tag before touching the
# server (needs AWS credentials here too).
bind_check_ecr: true

# Install Docker from Docker's apt repository (roles/docker_host) and free port
# 53 from systemd-resolved's stub listener. Both on by default, for freshly
# cloned VMs; networkdocker, set up by hand, turns them off.
bind_manage_docker: true
bind_manage_resolved: true

# The pre-Ansible setup tasks/cutover.yml removes. Only networkdocker has one
# (host_vars); elsewhere the cutover is a no-op.
bind_legacy_container: ""
bind_legacy_cron_user: root
bind_legacy_cron_jobs: []

# Preflight asks each forwarder in named.conf.options for example.com, from
# the server. One that doesn't answer is a warning; none answering fails.
bind_check_forwarders: true

# Files that must be committed and pushed for a deploy: what the image is
# built from, and what the deploy mounts. The deploy refuses otherwise, so
# the server always runs a commit that is on GitHub and was built by CI.
# `make deploy FORCE=1` sets bind_allow_unpushed for an emergency.
bind_deploy_files: [Dockerfile, entrypoint.sh, bind-reload.sh, zone_converter.py,
                    records.yaml, named.conf.options, named.conf.local]
bind_allow_unpushed: false

bind_container: bind
bind_zone: "{{ (lookup('file', bind_repo_root ~ '/records.yaml') | from_yaml).zone }}"

# Where verify asks, from this machine: what LAN clients use.
bind_verify_address: "{{ ansible_host }}"
# Also check recursion through the forwarders (the Pi-holes). They answer the
# server's networks; tests run where they don't.
bind_verify_recursion: true

# How long compose waits for the healthcheck (an SOA query) after a start.
bind_wait_timeout: 60
