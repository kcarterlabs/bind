---
- name: Create the BIND directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [ "{{ bind_root }}", "{{ bind_config_dir }}", "{{ bind_compose_dir }}" ]
  become: true

# --------------------------------------------------------------- image ---
# The one CI built and pushed for this code (preflight checked it's there).
# This machine pulls it from ECR and copies it over, only to a server that
# doesn't have it yet, so a records-only deploy moves no image at all. The
# servers never talk to ECR and hold no AWS credentials.

- name: Look for the image on the server
  ansible.builtin.command:
    argv: [docker, image, inspect, --format, "{{ '{{' }}.Id{{ '}}' }}", "{{ bind_image }}"]
  register: bind_image_present
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when: bind_docker_installed

# Under --check on a fresh VM there's no Docker to ask: it would need the image.
- name: Note whether the server needs the image
  ansible.builtin.set_fact:
    bind_image_needed: "{{ not bind_docker_installed or bind_image_present.rc != 0 }}"

# Under --check nothing is pulled or copied: say so instead.
- name: Would copy the image
  ansible.builtin.debug:
    msg: "Would pull {{ bind_image }} here (if missing) and copy it to {{ inventory_hostname }}."
  changed_when: true
  when: bind_image_needed and ansible_check_mode

- name: Bring the image here and copy it over
  when: bind_image_needed and not ansible_check_mode
  vars:
    bind_image_file: "{{ bind_image_cache }}/bind-{{ bind_image.split(':') | last }}.tar.gz"
  block:
    - name: Look for the image here
      ansible.builtin.command:
        argv: [docker, image, inspect, --format, "{{ '{{' }}.Id{{ '}}' }}", "{{ bind_image }}"]
      delegate_to: localhost
      become: false
      register: bind_image_local
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Log in to ECR, here
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          aws ecr get-login-password --region {{ bind_ecr_region | quote }}
          | docker login --username AWS --password-stdin {{ bind_ecr_registry | quote }}
        executable: /bin/bash
      delegate_to: localhost
      become: false
      when: bind_image_local.rc != 0 and bind_ecr_login | bool
      changed_when: false
      no_log: true

    - name: Pull it
      ansible.builtin.command:
        argv: [docker, pull, --quiet, "{{ bind_image }}"]
      delegate_to: localhost
      become: false
      when: bind_image_local.rc != 0

    - name: Create the image cache
      ansible.builtin.file:
        path: "{{ bind_image_cache }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    # Once per tag; the next server reuses the file.
    - name: Save it to a file
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          docker save {{ bind_image | quote }} | gzip -1 > {{ bind_image_file | quote }}.part &&
          mv {{ bind_image_file | quote }}.part {{ bind_image_file | quote }}
        executable: /bin/bash
        creates: "{{ bind_image_file }}"
      delegate_to: localhost
      become: false

    - name: Copy it to the server
      ansible.builtin.copy:
        src: "{{ bind_image_file }}"
        dest: "{{ bind_root }}/image.tar.gz"
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Load it
      ansible.builtin.command:
        argv: [docker, load, --quiet, --input, "{{ bind_root }}/image.tar.gz"]
      become: true

    - name: Remove the copy on the server
      ansible.builtin.file:
        path: "{{ bind_root }}/image.tar.gz"
        state: absent
      become: true
      changed_when: false

# --------------------------------------------------------------- config ---

- name: Copy records.yaml and the named.conf files
  ansible.builtin.copy:
    src: "{{ bind_repo_root }}/{{ item }}"
    dest: "{{ bind_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ bind_config_files }}"
  become: true
  notify: Reload bind

- name: Check whether BIND has been deployed by Ansible before
  ansible.builtin.stat:
    path: "{{ bind_compose_dir }}/compose.yaml"
  register: bind_compose_file
  become: true

- name: Render compose.yaml
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ bind_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  become: true

# ------------------------------------------------------------- cutover ---
- name: Hand over from the pre-Ansible setup
  ansible.builtin.import_tasks: cutover.yml

# ---------------------------------------------------------------- start ---
# compose's config hash covers compose.yaml, which carries the image tag, so a
# new image recreates the container. Config changes are the handler's job.
- name: Bring BIND up
  community.docker.docker_compose_v2:
    project_src: "{{ bind_compose_dir }}"
    state: present
    pull: never
    remove_orphans: true
    wait: true
    wait_timeout: "{{ bind_wait_timeout }}"
  become: true
  when: bind_compose_file.stat.exists or not ansible_check_mode

# Reload now, so the verify tasks see the final records.
- name: Apply pending reloads
  ansible.builtin.meta: flush_handlers

# This replaces monitor.sh: Docker's restart policy covers named dying (the
# container exits with it), and this covers named hanging (the healthcheck
# fails but the process lives). Restart, never redeploy.
- name: Restart BIND if its healthcheck fails
  ansible.builtin.cron:
    name: bind restart if unhealthy
    cron_file: bind-healthcheck
    user: root
    job: >-
      [ "$(docker inspect -f '{{ '{{' }}.State.Health.Status{{ '}}' }}' {{ bind_container }} 2>/dev/null)" = unhealthy ]
      && docker restart {{ bind_container }} >/dev/null
  become: true

# Earlier code versions' images, and the legacy :latest; the current one is
# in use. Only this repository's, never dinner-menu's from the same registry.
# Old saved copies here go too.
- name: List older BIND images
  ansible.builtin.command:
    argv: [docker, image, ls, --filter, "reference={{ bind_ecr_registry }}/{{ bind_ecr_repository }}", --format, "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"]
  register: bind_images
  changed_when: false
  check_mode: false
  become: true
  when: bind_docker_installed or not ansible_check_mode

- name: Remove them
  ansible.builtin.command:
    argv: "{{ ['docker', 'image', 'rm'] + (bind_images.stdout_lines | difference([bind_image])) }}"
  when:
    - bind_images is not skipped
    - bind_images.stdout_lines | difference([bind_image]) | length > 0
  become: true

- name: Find older saved images here
  ansible.builtin.find:
    paths: "{{ bind_image_cache }}"
    patterns: ["bind-*.tar.gz", "bind-*.tar.gz.part"]
    excludes: ["bind-{{ bind_image.split(':') | last }}.tar.gz"]
  register: bind_old_saves
  delegate_to: localhost
  become: false
  check_mode: false

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ bind_old_saves.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  delegate_to: localhost
  become: false
