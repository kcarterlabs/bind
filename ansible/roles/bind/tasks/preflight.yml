---
# Everything here is read-only and must run under --check too, or `make check`
# reports a correctly set-up server as broken.

# ------------------------------------------------- on this machine first ---

# The same lint `make validate` and CI run. named-checkzone runs too, inside
# the container, before every reload.
- name: Lint records.yaml
  ansible.builtin.command:
    argv: [python3, "{{ bind_repo_root }}/scripts/check-records.py", "{{ bind_repo_root }}/records.yaml"]
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false

- name: Work out the image tag for this checkout
  ansible.builtin.command:
    argv: ["{{ bind_repo_root }}/scripts/image-tag.sh"]
  delegate_to: localhost
  run_once: true
  become: false
  register: bind_image_tag
  changed_when: false
  check_mode: false

- name: Set the image to deploy
  ansible.builtin.set_fact:
    bind_image: "{{ bind_ecr_registry }}/{{ bind_ecr_repository }}:{{ bind_image_tag.stdout | trim }}"

# GitHub is the gate: push to main -> CI builds and pushes to ECR -> this
# pulls it. Deploying uncommitted or unpushed files would put records on
# the server that GitHub doesn't have, or ask for an image CI never built.
- name: Look for uncommitted changes to the deployed files
  ansible.builtin.command:
    argv: "{{ ['git', '-C', bind_repo_root, 'status', '--porcelain', '--'] + bind_deploy_files }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: bind_git_dirty
  changed_when: false
  check_mode: false
  when: not (bind_allow_unpushed | bool)

- name: Count commits not yet on origin/main
  ansible.builtin.command:
    argv: [git, -C, "{{ bind_repo_root }}", rev-list, --count, origin/main..HEAD]
  delegate_to: localhost
  run_once: true
  become: false
  register: bind_git_ahead
  changed_when: false
  check_mode: false
  when: not (bind_allow_unpushed | bool)

- name: Check everything deployed is committed and pushed
  ansible.builtin.assert:
    that:
      - bind_git_dirty.stdout | trim | length == 0
      - bind_git_ahead.stdout | trim == '0'
    fail_msg: >-
      {% if bind_git_dirty.stdout | trim %}Uncommitted: {{ bind_git_dirty.stdout_lines | join(', ') }}. {% endif %}
      {% if bind_git_ahead.stdout | trim != '0' %}{{ bind_git_ahead.stdout | trim }} commit(s) not pushed to origin/main. {% endif %}
      Commit and push, wait for the "Docker Image CI" run (gh run watch), then deploy.
      `make deploy FORCE=1` skips this in an emergency.
    quiet: true
  when: not (bind_allow_unpushed | bool)

- name: Check CI has pushed the image
  ansible.builtin.command:
    argv: [aws, ecr, describe-images, --region, "{{ bind_ecr_region }}", --repository-name, "{{ bind_ecr_repository }}",
           --image-ids, "imageTag={{ bind_image_tag.stdout | trim }}", --query, "imageDetails[0].imagePushedAt", --output, text]
  delegate_to: localhost
  run_once: true
  become: false
  register: bind_ecr_image
  changed_when: false
  failed_when: false
  check_mode: false
  when: bind_check_ecr | bool

- name: Fail if it isn't in ECR
  ansible.builtin.assert:
    that: bind_ecr_image.rc == 0
    fail_msg: >-
      {{ bind_image }} is not in ECR. It appears a minute or so after the push
      to main that changed the image's code (gh run list -R kcarterlabs/bind).
      If CI succeeded long ago, the lifecycle policy may have expired it:
      `make ecr-policy` keeps the last 30.
      ({{ bind_ecr_image.stderr | default('') | trim }})
    quiet: true
  when: bind_check_ecr | bool

# ------------------------------------------------------------ the server ---
- name: Look for Docker
  ansible.builtin.shell:
    cmd: command -v docker
  register: bind_docker_binary
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

# A freshly cloned VM has none: roles/docker_host installs it, right after
# preflight. A server that should already have it (bind_manage_docker off)
# and doesn't is an error.
- name: Note whether Docker is installed
  ansible.builtin.set_fact:
    bind_docker_installed: "{{ bind_docker_binary.rc == 0 }}"

- name: Fail if Docker is missing where this repo doesn't install it
  ansible.builtin.assert:
    that: bind_docker_installed or bind_manage_docker | bool
    fail_msg: "{{ inventory_hostname }} has no Docker, and bind_manage_docker is off for it."
    quiet: true

- name: Check Docker and the compose plugin are running
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: compose_version
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when: bind_docker_installed

- name: Fail if Docker is not up
  ansible.builtin.assert:
    that:
      - compose_version.rc == 0
    fail_msg: "Docker is not running on {{ inventory_hostname }}. ({{ compose_version.stderr | default('') }})"
    quiet: true
  when: bind_docker_installed

# Port 53 may only be held by Docker on behalf of BIND (the new container or
# the old one the cutover replaces), or by systemd-resolved's stub listener
# where tasks/resolved.yml is about to turn it off. Anything else -- the stub
# coming back on networkdocker after an upgrade, a host dnsmasq -- would make
# the container fail to start, and that server would be down until someone
# noticed.
- name: See which containers publish port 53
  ansible.builtin.command:
    argv: [docker, ps, --filter, "publish=53", --format, "{{ '{{' }}.Names{{ '}}' }}"]
  register: port_owners
  changed_when: false
  check_mode: false
  become: true
  when: bind_docker_installed

- name: See which processes listen on port 53
  ansible.builtin.command:
    argv: [ss, -Hlnptu, "sport = :53"]
  register: port_listeners
  changed_when: false
  check_mode: false
  become: true

- name: Check port 53 is free or BIND's
  vars:
    owners: "{{ port_owners.stdout_lines | default([]) | difference([bind_container, bind_legacy_container]) }}"
    allowed: "{{ ['docker-proxy'] + (['systemd-resolve'] if bind_manage_resolved | bool else []) }}"
    processes: "{{ port_listeners.stdout | regex_findall('users:\\(\\(\"([^\"]+)\"') | unique }}"
  ansible.builtin.assert:
    that:
      - owners | length == 0
      - processes | difference(allowed) | length == 0
    fail_msg: >-
      Port 53 on {{ inventory_hostname }} is held by something other than BIND:
      containers {{ owners }}, processes {{ processes | difference(allowed) }}.
      If it is systemd-resolved, set DNSStubListener=no in /etc/systemd/resolved.conf.
    quiet: true

# BIND forwards everything outside the zone to these (`forward only`), so a
# server whose forwarders don't answer it can't resolve the internet. The
# Pi-holes only answer their own subnet (listeningMode LOCAL), so this asks
# from the server, not from here.
- name: Read the forwarders from named.conf.options
  ansible.builtin.set_fact:
    bind_forwarders: >-
      {{ lookup('file', bind_repo_root ~ '/named.conf.options')
         | regex_findall('forwarders\s*\{[^}]*\}') | first | default('')
         | regex_findall('[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+') }}

- name: Ask each forwarder for example.com, from the server
  ansible.builtin.script:
    cmd: "{{ bind_repo_root }}/scripts/dns-ask.py {{ bind_forwarders | join(' ') }}"
    executable: python3
  register: bind_forwarder_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: bind_check_forwarders | bool

- name: Warn about forwarders that don't answer
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} gets no answer from forwarder(s)
      {{ bind_forwarder_check.stdout_lines | select('search', '^FAIL') | map('regex_replace', '^FAIL ', '') | join(', ') }}.
      BIND tries the others, but each query sent there waits for a timeout first.
  when:
    - bind_check_forwarders | bool
    - bind_forwarder_check.stdout_lines | select('search', '^FAIL') | list | length > 0

- name: Fail if no forwarder answers
  ansible.builtin.assert:
    that: bind_forwarder_check.stdout_lines | select('search', '^ok') | list | length > 0
    fail_msg: >-
      No forwarder in named.conf.options ({{ bind_forwarders | join(', ') }}) answers
      {{ inventory_hostname }}. BIND would serve the zone but resolve nothing else.
      ({{ bind_forwarder_check.stdout | default('') | trim }} {{ bind_forwarder_check.stderr | default('') | trim }})
    quiet: true
  when: bind_check_forwarders | bool
