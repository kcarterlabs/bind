# networkdocker (10.10.69.21): the original server, set up by hand before this
# repo existed. Checked on 2026-10-18: Ubuntu 24.04.3, Docker 29.1.3 with
# compose v5.0.0, systemd-resolved with DNSStubListener=no (so port 53 is
# free for BIND). Preflight re-checks what matters every run.

# Not in ~/Code/grafana's fleet: your own account and key. kenny has
# passwordless sudo and is in the docker group.
ansible_user: kenny
ansible_ssh_private_key_file: ~/.ssh/id_ed25519

# Docker was installed by hand, and Tailscale manages its resolv.conf. Leave
# both alone: dinner-menu runs on the same Docker.
bind_manage_docker: false
bind_manage_resolved: false

# The pre-Ansible setup, removed by the first deploy (tasks/cutover.yml).
# Both cron jobs must go before the old container does: monitor.sh runs
# every minute and, finding no `bind-flask`, would run deploy.sh, which
# deletes whatever holds port 53 and starts the ECR image again.
bind_legacy_container: bind-flask
bind_legacy_cron_user: kenny
bind_legacy_cron_jobs:
  - "* * * * * /home/kenny/bind/monitor.sh"
  - "@reboot sleep 30 && /home/kenny/bind/deploy.sh"
