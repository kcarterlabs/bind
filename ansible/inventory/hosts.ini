# The DNS servers: BIND for kcarterlabs.tech, recursing to the Pi-holes for
# everything else. Every host here gets an identical server from the same
# records.yaml; no zone transfers. bind.yml deploys them one at a time.
#
#   bind-a         VM on pve5 (PVE5-NVME), static 10.10.69.26/24. ns1 (once
#                  records.yaml says so, PLAN.md step 8).
#   bind-b         VM on pve4 (PVE4-NVME), static 10.10.69.27/24. ns2.
#   networkdocker  VM on 1u-pve-1, the 5700G (seasonal). The original server,
#                  serving until PLAN.md step 9 retires it. It also runs
#                  dinner-menu, which this repo never touches. Its quirks
#                  are in host_vars/networkdocker.yml.
#
# A new server: a cloned Ubuntu 24.04 VM, bootstrapped by ~/Code/grafana
# (svc-observability), then one line here and `make deploy`.
[dns]
bind-a        ansible_host=10.10.69.26
bind-b        ansible_host=10.10.69.27
networkdocker ansible_host=10.10.69.21
